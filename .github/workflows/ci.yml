name: CI

on:
  push:
    branches: [main, "bootstrap/**", "feature/**", "release/**", "codex/**"]
  pull_request:

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-dev.txt
      - name: Run unit tests
        run: pytest -q
        env:
          YOLO_AUTOINSTALL: "false"
          YOLO_CONFIG_DIR: ${{ runner.temp }}/ultralytics

  dashboard:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: pnpm/action-setup@v4
        with:
          version: "11.19.0"
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

  release-containers:
    needs: [backend-tests, dashboard]
    if: startsWith(github.ref, 'refs/heads/release/') || startsWith(github.head_ref, 'release/')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Prepare isolated release state
        run: |
          cp deploy/server2/.env.production.example .env
          sudo mkdir -p /var/lib/shopaware/{data,alerts,incidents,models,training,runs}
      - name: Build both CPU release images
        run: docker compose --env-file .env -f deploy/server2/docker-compose.yml build
      - name: Start services
        run: docker compose --env-file .env -f deploy/server2/docker-compose.yml up -d --wait --wait-timeout 300
      - name: Verify packaged runtime, actual CPU models and H.264 evidence
        run: |
          docker compose --env-file .env -f deploy/server2/docker-compose.yml exec -T shopaware python -m tools.check_runtime
          docker compose --env-file .env -f deploy/server2/docker-compose.yml exec -T shopaware python -c "import sqlite3; assert sqlite3.connect('/app/data/shopaware.db').execute('PRAGMA user_version').fetchone()[0] == 6"
          curl --fail --max-time 30 http://127.0.0.1:18082/health/live
          curl --fail --max-time 30 http://127.0.0.1:18081/api/health/live
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:18081/api/settings)" = 401
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:18081/api/cameras/not-a-camera/mode-settings)" = 401
      - name: Verify container recreation preserves state
        run: |
          sudo sha256sum /var/lib/shopaware/data/.shopaware.key > /tmp/shopaware-key.sha256
          docker compose --env-file .env -f deploy/server2/docker-compose.yml up -d --force-recreate --wait --wait-timeout 300
          sudo sha256sum --check /tmp/shopaware-key.sha256
          docker compose --env-file .env -f deploy/server2/docker-compose.yml exec -T shopaware python -m tools.check_runtime
          docker compose --env-file .env -f deploy/server2/docker-compose.yml exec -T shopaware python -c "import sqlite3; assert sqlite3.connect('/app/data/shopaware.db').execute('PRAGMA user_version').fetchone()[0] == 6"
      - name: Publish validated prerelease
        if: github.ref == 'refs/heads/release/v0.1.0-beta.6' || github.head_ref == 'release/v0.1.0-beta.6'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          RELEASE_TAG: v0.1.0-beta.6
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            EXISTING_TARGET="$(gh release view "$RELEASE_TAG" --json targetCommitish --jq .targetCommitish)"
            if [ "$EXISTING_TARGET" != "$RELEASE_SHA" ]; then
              echo "Refusing to reuse $RELEASE_TAG: existing target $EXISTING_TARGET != validated SHA $RELEASE_SHA" >&2
              exit 1
            fi
            echo "$RELEASE_TAG already points at the validated SHA."
          else
            gh release create "$RELEASE_TAG" \
              --target "$RELEASE_SHA" \
              --title "ShopAware v0.1.0-beta.6" \
              --notes-file docs/releases/v0.1.0-beta.6.md \
              --prerelease
          fi
      - name: Logs
        if: always()
        run: docker compose --env-file .env -f deploy/server2/docker-compose.yml logs --tail=100
      - name: Stop isolated services
        if: always()
        run: docker compose --env-file .env -f deploy/server2/docker-compose.yml down
