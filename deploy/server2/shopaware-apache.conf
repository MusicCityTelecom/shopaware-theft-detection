# Apache 2.4 reverse-proxy template for ShopAware on server2.
# Required modules: proxy proxy_http proxy_wstunnel headers ssl rewrite

<VirtualHost *:80>
    ServerName shopaware.innawareucp.com
    DocumentRoot /var/www/shopaware

    RewriteEngine On
    RewriteCond %{HTTPS} !=on
    RewriteRule ^ https://%{HTTP_HOST}%{REQUEST_URI} [R=301,L]

    ErrorLog ${APACHE_LOG_DIR}/shopaware-error.log
    CustomLog ${APACHE_LOG_DIR}/shopaware-access.log combined
</VirtualHost>

<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName shopaware.innawareucp.com
    DocumentRoot /var/www/shopaware

    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/shopaware.innawareucp.com/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/shopaware.innawareucp.com/privkey.pem

    ProxyRequests Off
    ProxyPreserveHost On
    ProxyTimeout 600

    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set X-Forwarded-Port "443"

    # WebSocket traffic bypasses Next.js and goes directly to FastAPI.
    ProxyPass        /ws ws://127.0.0.1:18080/ws retry=0 timeout=600
    ProxyPassReverse /ws ws://127.0.0.1:18080/ws

    # Everything else goes through the Next.js dashboard. Its same-origin /api
    # route proxies authenticated API requests to the backend container.
    ProxyPass        / http://127.0.0.1:18081/ retry=0 timeout=120
    ProxyPassReverse / http://127.0.0.1:18081/

    Header always set X-Content-Type-Options "nosniff"
    Header always set Referrer-Policy "same-origin"
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains"

    ErrorLog ${APACHE_LOG_DIR}/shopaware-ssl-error.log
    CustomLog ${APACHE_LOG_DIR}/shopaware-ssl-access.log combined
</VirtualHost>
</IfModule>
